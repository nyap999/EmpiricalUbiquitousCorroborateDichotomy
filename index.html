# 薄膜抵抗材料の日本知財 詳細レポート v1

## 版情報
- 作成日: 2026-03-16
- 版: v1
- データ基準: `本流61件 + 境界10件`
- 更新ルール: この詳細レポートは、ユーザーが明示的に更新を指示したときのみ改訂する
- 文献別の詳述: `2026-03-16_detailed_report_v1_appendix.md` を参照

## 0. このレポートの狙い
- `Ni-Cr系`, `Ta-N系`, `Cr-Si系` を中心に、日本公開公報ベースで「どの材料を、何のために、どう使いこなしてきたか」を立体的に整理する。
- 文献単位の情報と、材料系全体の流れの間を橋渡しする。
- 直系薄膜抵抗材料だけでなく、`トリミング`, `保護膜`, `電極`, `下地`, `process_control`, さらに `境界公報` まで含めて、技術トレンドの見落としを減らす。

## 1. エグゼクティブサマリー
- `Ni-Cr系` は最も厚く、1980年代の `低TCR組成窓の探索`、1985年前後の `希土類添加による組成ずれ耐性の獲得`、2005-2008年の `多目的最適化`、2011年以降の `alloy + glass 複合化` という4段階で読むと全体像が整理しやすい。
- `Ta-N系` は、Ni-CrやCr-Siほど「多元素添加の枝」が太いわけではなく、`N量`, `酸化熱処理`, `積層`, `希ガススパッタ`, `電極込みの合成TCR`, `TaSiN化` という `process-driven` な流れが本質に近い。
- `Cr-Si系` は、1982年の `Zr/Mo` 添加の初期枝から始まり、1990年代の `実装・加工対策`, `アモルファス化`, `O + B/C/N` などの組成工夫、2000年代の `Cr-Al-Si`, 2010年代以降の `Si-Cr-N layered cancellation`, `Cr-Si-C/N`, `target engineering` へ進む。2020年代も直系開発が続いているのが特徴。
- `横断技術` は単なる周辺要素ではなく、材料系の実用化条件そのものである。とくに `process_control` は、`後熱処理`, `成膜ガス`, `合成TCR`, `微細加工`, `粉末/ガラス粒径`, `ターゲット内部組織` までつながる。
- `境界公報` は、本流から少し外れるが将来の派生先を示す。Ni-Crでは `foil`, `current sensing`, `NiCrSiO/Cr built-in resistor`、Ta-Nでは `thermal printhead`、Cr-Siでは `transparent / sensor branch` が見えている。

## 2. まず全体をどう読むか

### 2.1 時代ごとの主題
- `1970年代末`
  - TaN はまず `成膜後の酸化熱処理` でTCRを追い込む。出発点は材料追加より `後処理` にある。
- `1980年代前半`
  - Ni-Cr は `Si` や `Al + Si` の狭い組成窓をどう安定利用するかが主題。
  - Cr-Si はすでに `Zr`, `Mo` を加えた第三元素枝があり、初期から「二元系をそのまま使う」より「第三元素で使いこなす」発想がある。
  - Ta-N は `Ta2N + alpha-Ta` や `SiO2` を含む積層・後処理で近零TCRを狙う。
- `1980年代後半`
  - Ni-Cr では松下系の `La / Sc / Eu` 添加群が現れ、低TCRそのものより `組成ばらつきに対するTCRの鈍感化` が重要テーマになる。
- `1990年代`
  - Ta-N は `Ne/Ar/Kr/Xe + N2` の希ガススパッタで真空アニール依存を下げる。
  - Cr-Si は `Al配線との干渉`, `レーザトリミング`, `接触部ダメージ抑制` など、半導体・実装との界面で使いこなす方向が太い。
  - Ni-Cr はこの時期の母集団がまだ薄いが、`Ta-Si` や `Al-Si` による安定化枝がつながっている。
- `2000年代`
  - Ni-Cr は一気に多枝化し、`rare-earth`, `Ta`, `Ta-Al`, `Ta-Al-Mo`, `Si-C`, `Mn/Fe` などで `高温安定性`, `耐食性`, `高比抵抗`, `鋳造性`, `量産窓` を同時に最適化する。
  - Ta-N は膜単体ではなく `中間膜・電極まで含めた全体TCR設計` に進む。
  - Cr-Si は `Cr-Al-Si` や `valve / transition metal` 追加で、抵抗材料としての再設計が進む。
- `2010年代`
  - Ni-Cr は `Ni-based + Cr/Al/Y + silicate glass` により、薄膜抵抗材料が `alloy + glass` 複合設計へ再定義される。
  - Ta-N は `TaSiN` により半導体多層配線との整合を取る。
  - Cr-Si は `Si-Cr-N` 二層での正負TCR相殺、on-chip抵抗の工程設計が目立つ。
- `2020年代`
  - Ni-Cr は `pure SiO2 glass`, `粉末粒径`, `低温熱処理` が前面化し、近年の主戦場は複合抵抗材料。
  - Cr-Si は `Cr-Si-C`, `Cr-Si-N`, `binary target densification`, `partial crystallization` へ展開し、むしろ活発。
  - Ta-N は直系の日本公開公報が薄く、代わりに `thermal printhead` など近傍応用へ展開している。

## 3. 材料系ごとの流れ

### 3.1 Ni-Cr系
Ni-Cr系は、この調査で最もはっきりとした `世代交代` が見える材料系である。大きく分けると、`初期の組成窓探索`, `希土類による製造安定化`, `2000年代の多目的最適化`, `alloy + glass 複合化` の4相で読むと理解しやすい。

#### 第1相: 1983-1984年の初期組成窓探索
- `JPS58119601A` は `Ni-Cr-Si` を low-TCR の早期本流として示す。
- `JPS5822379A` は `Ni-Cr-Al-Si` を target 側から安定利用しようとする。
- `JPS59157282A` は `高Si Ni-Cr target` という、より高抵抗薄膜へ寄せる枝を見せる。

この段階の主題は、`どの元素を入れるか` そのものより、`狭い組成窓をどう工業的に使える状態にするか` にある。Appendix ではこの相の各文献を、`Si-only low-TCR`, `Al-Si target reproducibility`, `high-Si target` に分けて読むとよい。

#### 第2相: 1985年前後の希土類添加クラスタ
- `La / Sc / Eu` を `Ni-Cr-Al` または `Ni-Cr-Si` に入れた松下系群が中核。
- ここでの本質は、低TCR値を一度だけ出すことではなく、`組成ぶれに対してTCRが暴れにくい材料系` を作ることにある。

このクラスタは、Ni-Cr系知財の中でも `量産安定化思想` が最もよく見える部分である。Appendix の 1980年代Ni-Cr群では、`JPS6018123B2`, `JPS6018124B2`, `JPS6024562B2`, `JPS6024563B2`, `JPS6024564B2` をひとかたまりとして読むのがよい。

#### 第3相: 1990年代後半から2008年までの多目的最適化
- `JPH045241B2`, `JPH0620803A` では `耐湿`, `負荷寿命`, `高温安定`, `量産性` が前面化する。
- 2005-2008年の住友金属鉱山群では、`rare-earth generalization`, `Al-free castability`, `Ta corrosion branch`, `Ta-Al`, `Ta-Al-Mo`, `Si-C high resistivity` が並立する。
- この段階では、単一指標の最適化ではなく、`高比抵抗`, `低TCR`, `高温安定`, `耐塩水`, `鋳造性`, `熱処理窓` を同時に解く方向へ移る。

Ni-Cr系を深く読むなら、この第3相が最重要である。Appendix では 2000年代Ni-Crの各文献を個別に見るだけでなく、`Alを残す枝`, `Alを抜く枝`, `Taを使う枝`, `Ta + Al + Mo枝`, `Si + C枝` として横に比較すると発明意図が見えやすい。

#### 第4相: 2011年以降の alloy + glass 複合化
- `JP2011119234A` と `JP5045804B2` は、Ni-Cr直系というより `Ni-based resistor alloy + glass` へ重心を移す。
- `JP2020007601A` と `JP7087741B2` では、`pure SiO2 glass`, `Ni合金粉末粒径 >= 30 um`, `ガラス粉 3-20 mass%`, `ガラス粉径 <= 200 um` など、粉末設計そのものが発明要素になる。

ここは「Ni-Cr系の終盤」ではなく、「Ni系薄膜抵抗材料の再定義」とみるのがよい。材料名だけ見るとNi-Crの連続性が薄く見えるが、技術思想としては `高比抵抗・高温安定・耐食・低温処理` を Ni系複合材料で引き継いでいる。

### 3.2 Ta-N系
Ta-N系の特徴は、Ni-CrやCr-Siのような `多元素添加カタログ` ではなく、`プロセスで追い込む文化` が強いことである。

#### 第1相: 後熱処理と積層
- `JPS547600A` は `酸化雰囲気熱処理` によりTCRを最小化する初期知財。
- `JPS5931239B2` は `SiO2 overlayer` を含む後処理・信頼性の枝。
- `JPH01291401A` は `Ta2N + alpha-Ta` の正負TCR相殺という積層思想を示す。

この相では、材料添加よりも `相構成` と `後処理` が核心である。

#### 第2相: 1990年代の process control
- `JPH06275409A` は `Ne/Ar/Kr/Xe + N2` と逆スパッタ条件で真空アニールなしの近零TCRを狙う。
- `JPH04223367A` は TaN 薄膜の `lift-off patterning` による膜厚均一性と所定抵抗値確保を示す。

ここでTa-Nは、単に膜そのものを変えるのではなく、`どう形成するか` に重心を移す。

#### 第3相: デバイス全体との整合
- `JP2004342705A` は `N分圧 + Ti中間膜 + Au電極` を一体で見て、接触抵抗込みの合成TCRを制御する。
- `JP2013098519A` と `JP5824330B2` は `TaSiN` により、半導体多層配線に載る高抵抗・低TCR材料へ進む。

この系では、材料トレンドを読むときに `膜単体` だけ見ると誤る。Appendix の Ta-N群では、`後熱処理`, `stack`, `gas control`, `whole-device TCR`, `TaSiN integration` の5テーマに分けて読むのが有効である。

### 3.3 Cr-Si系
Cr-Si系は、今回の調査で `2020年代も太い` ことが確認できた系である。Ni-Crに比べると、`実装や加工と一体で最適化する傾向` が一貫して強い。

#### 第1相: 1982年の第三元素枝
- `JPS574102A` の `Zr`、`JPS577102A` の `Mo` は、Cr-Siが初期から `第三元素を前提に使いこなす` 系だったことを示す。

#### 第2相: 1990年代の実装・加工・アモルファス化
- `JPH02271565A` はレーザトリミングで on-chip 基準調整へ使う枝。
- `JPH0414251A` は Al配線熱履歴による抵抗低下を `抵抗体形状` で抑える枝。
- `JPH07120573B2` は二元Cr-Siのアモルファス安定化。
- `JPH08264304A` は `O + B/C/N` により `±100 ppm/K` 級の low-TCR を狙う。
- `JP2577969B2` は `Ti 2-15 wt%` によるクロムシリサイド形成抑制とアモルファス安定化。

この相は、Cr-Siの使いこなしが `材料組成` と `加工・実装適合` の両輪で進むことを示している。

#### 第3相: 2000年代の再構成
- `JP2002141201A` は `valve metal / transition metal` を足して高抵抗・低コスト化を図る。
- `JP2007073651A` / `JP4742758B2` は `Cr-Al-Si + oxygen anneal` により高比抵抗・低TCR・耐熱をまとめて狙う。

#### 第4相: 2010年代以降の stack / phase / target engineering
- `JP2010278479A` は `CrSi target + N2 + via/contact design` で on-chip抵抗を工程ごと設計する。
- `JP2017022176A` は `Si-Cr-N` 二層で正負TCRを相殺する。
- `JP7609258B2` は `Cr-Si-N` の温度帯別TCR設計。
- `JP7671225B2` は `Cr-Si-C` の `部分結晶化` による混相設計。
- `JP2023064278A`, `JP7676729B2`, `JP7715152B2` は target 側の `クラック`, `密度`, `粒子`, `相分率` を制御し、低TCR膜へつなぐ。

Cr-Si系は、材料そのものだけでなく `target engineering` が知財の主戦場になっている点で、2020年代の読み応えがある。

### 3.4 横断技術と境界公報
横断技術は、材料系の補助ではなく実用化条件である。

- `trimming`
  - `JPH03173101A` は `Ta2N meander + NiCr trim pad` という hybrid 調整思想を示す。
  - `JP2010062407A` はレーザトリミング後の樹脂保護膜密着まで含める。
- `underlayers / interfaces`
  - `JPH05135904A` は `Al拡散界面` による polyimide 密着改善を示し、薄膜抵抗が下地層設計と不可分であることを示す。
- `electrodes / passivation`
  - `JP2009194129A`, `JP2020013804A` は接続穴や二層保護膜で精度と信頼性を維持する。
- `process_control`
  - `JPH04223367A`, `JPH07335831A`, `JP2009099755A` は、微細加工シーケンス自体が性能知財であることを示す。

境界公報は Appendix の末尾で別建てにした。これは、本流から外すことで見通しを良くしつつ、派生用途を将来追跡できるようにするためである。Ni-Cr系の `foil / current sensing / built-in resistor on foil`、Ta-N系の `thermal printhead`、Cr-Si系の `transparent / sensor branch` は、将来のレポート改訂で本流化する可能性がある。

## 4. 全体の流れと文献単位の読み方をどうつなぐか

### 4.1 まず「何を足したか」だけで読まない
- Ni-Cr の `La / Sc / Eu` は、単なる添加元素リストではなく `組成ばらつき耐性` の知財として読む。
- Cr-Si の `Ti`, `O`, `B/C/N`, `Al`, `C`, `N` は、相安定化, トリミング適性, on-chip整合, target 側安定化など役割が異なる。
- Ta-N は、むしろ `何を足したか` より `どの相・どの工程・どの層構成で追い込んだか` が重要。

### 4.2 材料系ごとの主たる発明軸
| 系 | 主たる発明軸 | 典型文献 |
| --- | --- | --- |
| Ni-Cr | 組成窓安定化, 希土類安定化, 耐食/高温/鋳造性の同時最適化, alloy+glass 複合化 | `JPS6018124B2`, `JP2005294612A`, `JP2008010604A`, `JP2020007601A` |
| Ta-N | 後熱処理, 積層, 希ガススパッタ, 合成TCR, TaSiN化 | `JPS547600A`, `JPH01291401A`, `JPH06275409A`, `JP2004342705A`, `JP2013098519A` |
| Cr-Si | 第三元素添加, 実装・加工対策, stack cancellation, target/phase engineering | `JP2577969B2`, `JPH0414251A`, `JP2017022176A`, `JP7671225B2`, `JP7715152B2` |

### 4.3 Appendix の使い方
- `まず本体で大きな流れを掴む`
- `次に Appendix で該当クラスタの文献を年代順に見る`
- `そのあと pdf フォルダへ戻る`

とくに Appendix では、各文献ごとに
- 発明の名称
- 公開番号 `JPS... / 特開...`
- 会社名 / 年
- 採用材料と狙い
- 効果
- 全体の流れの中での立ち位置

を一つずつ揃えた。これにより、`全体トレンド -> 個別公報 -> 原文PDF` の順で見返しやすくしている。

## 5. 現時点で厚い部分と、まだ薄い部分
- 厚い部分
  - `Ni-Cr 1980s`, `Ni-Cr 2000s`
  - `Cr-Si 1990s`, `Cr-Si 2020s`
  - `process_control` の年代別整理
- 薄い部分
  - `Ta-N 2020s` の直系日本公開公報
  - `Ni-Cr 1990s` の母集団
  - `Cr-Si 2000s` の中継区間

したがって、このv1を読むときは、
- `Ni-Cr`: かなり本流が見えている
- `Cr-Si`: 2020年代まで含めて流れが読める
- `Ta-N`: 方向性は読めるが、近年件数はまだ薄い

という前提で解釈するとよい。

## 6. 結論
- 薄膜抵抗材料の日本知財は、単純な「材料名の履歴」ではなく、`組成窓`, `相制御`, `工程`, `電極/保護膜/下地`, `ターゲット`, `粉末粒径`, `複合化` の歴史として読むべきである。
- `Ni-Cr` は `量産安定化 -> 多目的最適化 -> 複合材料化`、`Ta-N` は `process-driven control -> stack/device integration`、`Cr-Si` は `第三元素化 -> 実装適合 -> stack/target/phase engineering` という形で理解すると、個別公報の位置づけが崩れにくい。
