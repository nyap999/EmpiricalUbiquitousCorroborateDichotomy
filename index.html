# 薄膜抵抗材料の日本知財 詳細レポート v1 付録

## 付録の使い方
- 各文献について、`発明の名称`, `公開番号`, `会社名`, `年`, `採用材料と狙い`, `効果`, `全体の流れの中での立ち位置` を揃えた。
- `公開番号` は、手元で追いやすいように `収録公報番号 / 特開表記` を併記した。
- 効果の定量値は、今回の整理で確認できた範囲のみ記載した。数値がない文献は、Google Patents抄録・本文テキストから読める質的効果を記した。
- `境界公報` は本流とは分けて末尾にまとめた。

## 1. Ni-Cr系

### 1980年代

### `JPS5822379A / 特開昭58-22379`
- 発明の名称: Target for sputtering
- 会社名 / 年: TAMA DENKI KOGYO KK / 1983
- 材料・採用意図: `Ni-Cr-Al-Si` ターゲットを採用し、厳しいスパッタ条件管理なしでも安定な比抵抗と再現性を得ることを狙う。
- 効果: 定量値は未確認だが、`安定比抵抗` と `再現性向上` が主効果。
- 立ち位置: Ni-Cr系のかなり早い段階で、材料そのものより `target 側で量産安定化する` 発想を示した初期枝。

### `JPS58119601A / 特開昭58-119601`
- 発明の名称: Resistor
- 会社名 / 年: Tokyo Sanyo Electric Co Ltd / 1983
- 材料・採用意図: `Ni-Cr-Si` を採用し、精密薄膜抵抗で `ほぼ零TCR` を狙う。
- 効果: 抄録レベルでは `near-zero TCR` が主効果で、低TCR精密抵抗の早期実証例とみなせる。
- 立ち位置: Ni-Cr系の `Si-only low-TCR` 本流の起点に近い文献。

### `JPS59157282A / 特開昭59-157282`
- 発明の名称: High electric resistance sputtering target
- 会社名 / 年: Toyo Soda Manufacturing Co Ltd / 1984
- 材料・採用意図: `Si 15-30%` の高Si `Ni-Cr` ターゲットで、高抵抗薄膜を形成しやすくする。
- 効果: `高初期抵抗`, `小TCR`, `高抵抗薄膜への適性` が主効果。
- 立ち位置: 1980年代Ni-Crの中で、`高Si target` による高面積抵抗化を押し出した枝。

### `JPS6016724B2 / 特開昭57-5301`
- 発明の名称: Thin film resistor alloy
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1985
- 材料・採用意図: `Ni-Cr-Si-Sc` を用い、低TCRだけでなく `組成ばらつきに対して安定なTCR` を得る。
- 効果: 定量値は未確認だが、`低TCR` と `広い組成許容幅` が主効果。
- 立ち位置: 1985年前後の希土類添加クラスタの中で、`Sc` を使う Si系枝。

### `JPS6018123B2 / 特開昭57-5303`
- 発明の名称: Thin film resistor alloy
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1985
- 材料・採用意図: `Ni-Cr-Si-La` により、Si系低TCR枝をより量産安定に使いこなす。
- 効果: 定量値は未確認だが、`低TCR` と `組成窓の安定化` が効果。
- 立ち位置: `La` を使う Si系枝で、松下系 rare-earth cluster の中核。

### `JPS6018124B2 / 特開昭57-5304`
- 発明の名称: Thin film resistor alloy
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1985
- 材料・採用意図: `Ni-Cr-Al-La` を用い、Al系でも低TCRと製造安定性を両立する。
- 効果: 定量値は未確認だが、`Al系組成の low-TCR 安定化` が主効果。
- 立ち位置: `Al系 + rare-earth` の代表で、後の `Ni-Cr-Al-Si` 量産枝や高温安定枝の前提になる。

### `JPS6024562B2 / 特開昭57-5306`
- 発明の名称: Thin film resistor alloy
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1985
- 材料・採用意図: `Ni-Cr-Si-Eu` により、Si系 low-TCR をより鈍感な組成窓で使う。
- 効果: 定量値は未確認だが、`低TCR` と `製造ばらつき耐性` が主効果。
- 立ち位置: Si系 rare-earth クラスタの一角で、La / Sc / Eu の役割比較に使える。

### `JPS6024563B2 / 特開昭57-5307`
- 発明の名称: Thin film resistor alloy
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1985
- 材料・採用意図: `Ni-Cr-Al-Sc` により、Al系組成の low-TCR 安定化を図る。
- 効果: 数値は未確認だが、`低TCR` と `組成許容幅の拡大` が主効果。
- 立ち位置: Al系 rare-earth cluster の `Sc` 枝。

### `JPS6024564B2 / 特開昭57-5308`
- 発明の名称: Thin film resistor alloy
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1985
- 材料・採用意図: `Ni-Cr-Al-Eu` を用い、Al系薄膜抵抗を安定利用する。
- 効果: 数値は未確認だが、`低TCR` と `量産安定性` が主効果。
- 立ち位置: Al系 rare-earth cluster の `Eu` 枝で、La / Sc / Eu 比較の3本目。

### `JPS63147305A / 特開昭63-147305`
- 発明の名称: Thin film resistor
- 会社名 / 年: TDK Corp / 1988
- 材料・採用意図: `Ni-Cr-Al-Si` 薄膜で、`高安定`, `低TCR`, `広い面積抵抗域`, `良好な再現性` をまとめて狙う。
- 効果: 数値は未確認だが、`組成窓の実用化` が主効果。
- 立ち位置: 1980年代末の `Ni-Cr-Al-Si` 実装枝で、松下系 rare-earth 安定化を受けた `量産設計` 側の整理点。

### 1990年代

### `JPH045241B2 / 特開昭60-27103`
- 発明の名称: Thin-film resistor alloy
- 会社名 / 年: 出願人表示未確定 / 1992
- 材料・採用意図: `Ni-Cr-Ta-Si` を使い、`小TCR変動`, `耐湿性`, `負荷寿命` を改善する。
- 効果: 定量値は未確認だが、`熱処理後の安定化` と `信頼性向上` が主効果。
- 立ち位置: 1990年代Ni-Crで `Ta` を取り込む初期枝として重要。

### `JPH0620803A / 特開平6-20803`
- 発明の名称: Thin film resistor
- 会社名 / 年: TDK Corp / 1994
- 材料・採用意図: `Ni-Cr-Al-Si` を用い、`高温安定性`, `抵抗温度特性`, `生産性` を両立する。
- 効果: 定量値は未確認だが、`再結晶制御` を含む量産適性の改善が効いている。
- 立ち位置: rare-earth 依存より、`Ni-Cr-Al-Si を工業的に使いこなす` 1990年代の主流枝。

### 2000年代

### `JP2000182802A / 特開2000-182802`
- 発明の名称: Resistance material
- 会社名 / 年: Akita Prefecture / 2000
- 材料・採用意図: `Ni-Cr + Al/Si group + Mn/Fe group` を使い、広温度域でTCRをゼロ近傍に平坦化する。
- 効果: `広温度域で near-zero TCR` を狙う点が特徴で、登録側では `約±2 ppm/C` 級の表現が見える。
- 立ち位置: Ni-Cr系の中で `多元系平坦化` を前面に出す枝。

### `JP2005290401A / 特開2005-290401`
- 発明の名称: Resistive thin film sputtering target material and resistive thin film resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2005
- 材料・採用意図: `Ni-Cr-Al-Si + rare earth` を用い、厳しい環境でも near-zero TCR と高温安定性を得る。
- 効果: 定量値は未確認だが、`Y / La / Ce / misch metal` まで含めて rare-earth を一般化した点が重要。
- 立ち位置: 2005-2008住友群の出発点で、rare-earth を再び主役に戻した枝。

### `JP2005294612A / 特開2005-294612`
- 発明の名称: Resistive thin film sputtering target material and resistive thin film resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2005
- 材料・採用意図: `Ni-Cr-Si + rare earth` として `Alを抜き`, near-zero TCR と高温安定性を狙う。
- 効果: 定量値は未確認だが、`鋳造性 / target 生産性の改善` が重要効果。
- 立ち位置: 住友群の中で `Al-free` に明確な意味を与えた枝。

### `JP2006190871A / 特開2006-190871`
- 発明の名称: Resistive thin film sputtering target material and resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2006
- 材料・採用意図: `Ni-Cr-Ta` を用い、`塩素`, `人工汗液` などへの耐食性を上げつつ Ni-Cr相当のTCRを維持する。
- 効果: 数値は未確認だが、`耐食性` を主指標に据えたことが特徴。
- 立ち位置: 住友群の `Ta-only corrosion branch`。

### `JP2006313785A / 特開2006-313785`
- 発明の名称: Resistive thin-film sputtering target material and resistive thin-film resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2006
- 材料・採用意図: `Ni-Cr-Si-C` を採用し、高比抵抗と小TCRを同時に得る。
- 効果: `500-3000 uohm*cm`, `TCR -25 to +25 ppm/C` が示されており、この群では比較的定量的。
- 立ち位置: Ni-Crで `C添加` を主役にした高比抵抗枝。

### `JP3852446B2 / 特開2005-154884`
- 発明の名称: Resistive thin film sputtering target material and resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2006
- 材料・採用意図: `Ni-Cr-Al + rare earth` を用い、175C級での高温安定性を従来 `Ni-Cr-Al-Si` より高める。
- 効果: 数値は未確認だが、`175C級安定性` が差別化点。
- 立ち位置: 住友群の rare-earth branch を登録公報側から裏づける文献。

### `JP2008007810A / 特開2008-7810`
- 発明の名称: Resistive thin film sputtering target material and resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2008
- 材料・採用意図: `Ni-Cr-Ta-Al` により、耐塩水性と高温安定性を両立する。
- 効果: `TCR -25 to +25 ppm/C`, `155C 高温安定`, `塩水耐性` が主効果。
- 立ち位置: `Ta-only` から `Ta + Al` へ進んだ中間枝。

### `JP2008010604A / 特開2008-10604`
- 発明の名称: Resistive thin film sputtering target material and resistor element
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2008
- 材料・採用意図: `Ni-Cr-Ta-Al-Mo` により、表面酸化膜制御を含めて高比抵抗・耐食・広い熱処理窓を取る。
- 効果: 定量値は未確認だが、`高比抵抗`, `耐塩水`, `熱処理窓拡大` が主効果。
- 立ち位置: 住友群の中でも `最も多目的最適化が進んだ枝` の一つ。

### 2010年代

### `JP2011119234A / 特開2011-119234`
- 発明の名称: Resistor material and resistor
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2011
- 材料・採用意図: `Ni-based resistor alloy + Cr/Al/Y + silicate glass` を用い、比較的低温熱処理でも高比抵抗・良好TCR・高温安定・耐塩水性を得る。
- 効果: 数値は未確認だが、`低温熱処理適合` と `複合材料化` が主効果。
- 立ち位置: Ni-Cr系を `alloy + glass` 複合設計へ移した転換点。

### `JP4752075B2 / 特開2000-182802`
- 発明の名称: Resistance material
- 会社名 / 年: Akita Prefecture / 2011
- 材料・採用意図: `Ni-Cr-Al-Mn` 系として、広温度域のTCR平坦化を登録公報側から裏づける。
- 効果: `約±2 ppm/C` 級の広温度域TCR平坦化が読み取れる。
- 立ち位置: 2000年公開群の登録側で、`Mn` 添加の意味をはっきりさせる文献。

### `JP5045804B2 / 特開2011-119234`
- 発明の名称: Resistor material and resistor
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2012
- 材料・採用意図: `Ni-based alloy + silicate glass` の複合抵抗材料を登録公報側で固める。
- 効果: 定量値は未確認だが、`高比抵抗`, `高温安定`, `低温側プロセス適合` の継続性を示す。
- 立ち位置: `JP2011119234A` の登録側で、alloy+glass branch の本流性を裏づける。

### 2020年代

### `JP2020007601A / 特開2020-7601`
- 発明の名称: Resistor material and resistor
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2020
- 材料・採用意図: `Ni-based resistor alloy + Cr/Al/Y + pure SiO2 glass` を用い、低温熱処理でも高比抵抗と高温安定性を得る。
- 効果: `Ni合金粉末 >= 30 um`, `ガラス 3-20 mass%`, `ガラス粉径 <= 200 um` の条件が明示され、粉末設計が実質的な効果源になっている。
- 立ち位置: 2020年代Ni系本流であり、`合金設計 + ガラス設計 + 粉末粒径設計` へ進んだ枝。

### `JP7087741B2 / 特開2020-7601`
- 発明の名称: Resistor material and resistor
- 会社名 / 年: Sumitomo Metal Mining Co Ltd / 2022
- 材料・採用意図: `JP2020007601A` の登録公報として、SiO2 glass 複合枝を定着させる。
- 効果: 定量値は未確認だが、`より低温プロセスで高比抵抗・高温安定` という方向性が明確。
- 立ち位置: alloy+glass branch が 2020年代も継続していることを示す確証。

## 2. Ta-N系

### pre1980

### `JPS547600A / 特開昭54-7600`
- 発明の名称: Tantalum nitride thin-film resistor and its manufacture
- 会社名 / 年: NEC Corp / 1979
- 材料・採用意図: `TaN` 薄膜を成膜後に `酸化雰囲気熱処理` し、TCRを最小化する。
- 効果: 近零TCR化を後処理で実現する点が主効果で、数値は未確認。
- 立ち位置: Ta-N系の最初期本流で、`材料追加ではなく後処理で追い込む` 文化の出発点。

### 1980年代

### `JPS55121606A / 特開昭55-121606`
- 発明の名称: Thin-film resistor
- 会社名 / 年: Fujitsu Ltd / 1980
- 材料・採用意図: タイトルOCRから `TaAlN/TaN family` と読める薄膜抵抗で、TCR制御を狙う。
- 効果: OCR制約が強く定量値は未確認だが、Ta-N系のTCR調整枝として扱える。
- 立ち位置: Ta-N と Ta-Al-N の境界にある可能性があるため、Appendix では仮置き的に扱う。

### `JPS5931239B2 / 特開昭50-80477`
- 発明の名称: Thin film resistor
- 会社名 / 年: Nippon Electric Co Ltd / 1984
- 材料・採用意図: `TaN + SiO2 overlayer` と熱処理で TCR と信頼性を改善する。
- 効果: 数値は未確認だが、`TCR改善` と `信頼性向上` が主効果。
- 立ち位置: `酸化熱処理` の初期系を、保護・後処理込みで再構成した枝。

### `JPH01291401A / 特開平1-291401`
- 発明の名称: Thin film resistor
- 会社名 / 年: FDK Corp / 1989
- 材料・採用意図: `Ta2N + alpha-Ta` の積層で、正負TCRを相殺して近零TCRを得る。
- 効果: `near-zero TCR` が主効果で、積層設計による TCR cancellation を示す。
- 立ち位置: Ta-N系の中で `stack design` が主役になることを明確にした文献。

### 1990年代

### `JPH06275409A / 特開平6-275409`
- 発明の名称: Thin film resistor and manufacture thereof
- 会社名 / 年: Fujitsu Ltd / 1994
- 材料・採用意図: `TaN` を `Ne/Ar/Kr/Xe + N2` 雰囲気でスパッタし、逆スパッタRF条件も使ってTCRを合わせる。
- 効果: `真空アニールなしで 0 ppm/C 近傍` を狙う点が重要。
- 立ち位置: Ta-N系の `process-driven control` を代表する文献。

### 2000年代

### `JP2004342705A / 特開2004-342705`
- 発明の名称: Thin film resistor element and manufacturing method thereof
- 会社名 / 年: Cimeo Precision Co Ltd / 2004
- 材料・採用意図: `TaN` に `N量`, `Ti中間膜`, `Au電極` を組み合わせ、接触抵抗まで含めた全体TCRを下げる。
- 効果: 数値は未確認だが、`whole-device TCR compensation` が主眼。
- 立ち位置: Ta-Nを `膜単体` から `デバイス全体` で設計する段階へ進めた文献。

### 2010年代

### `JP2013098519A / 特開2013-98519`
- 発明の名称: Semiconductor device and method for manufacturing the same
- 会社名 / 年: Renesas Electronics Corp / 2013
- 材料・採用意図: `TaSiN` 抵抗層を用い、多層配線の中で高抵抗・低TCRを実現する。
- 効果: 数値は未確認だが、`半導体多層配線との整合` が大きい。
- 立ち位置: Ta-N から `TaSiN` へ進む半導体寄り本流。

### `JP5824330B2 / 特開2013-98519`
- 発明の名称: Semiconductor device and method for manufacturing the same
- 会社名 / 年: Renesas Electronics Corp / 2015
- 材料・採用意図: `TaSiN` 抵抗層を登録公報側で確定し、高抵抗・低TCRの半導体内蔵抵抗を維持する。
- 効果: 具体値は未確認だが、TaSiN branch の継続性を担保する。
- 立ち位置: Ta-N本流が `TaSiN semiconductor integration` へ移ったことを示す文献。

## 3. Cr-Si系

### 1980年代

### `JPS574102A / 特開昭57-4102`
- 発明の名称: Thin film resistor
- 会社名 / 年: Matsushita Electric Industrial Co Ltd / 1982
- 材料・採用意図: `Cr-Si-Zr` により、Cr-Si系薄膜抵抗を第三元素で使いこなす。
- 効果: 旧公報OCR制約で定量値は未確認だが、初期から第三元素化が意識されていたことが重要。
- 立ち位置: Cr-Si本流の最初期にある `Zr枝`。
